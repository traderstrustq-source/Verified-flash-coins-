<!DOCTYPE html>

  --acc:#00e0a4; --acc2:#3aa0ff; --warn:#ffb020; --bad:#ff4d6d;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:
    radial-gradient(900px 500px at 80% -10%,rgba(58,160,255,.16),transparent 60%),
    radial-gradient(700px 500px at -10% 10%,rgba(0,224,164,.13),transparent 60%),

}

.spacer{flex:1}

.scroll{max-height:320px;overflow:auto;-webkit-overflow-scrolling:touch}

</head>

async function sha(text) {
  const buf = new TextEncoder().encode(text);
  const d = await crypto.subtle.digest("SHA-256", buf);
  return Array.from(new Uint8Array(d)).map(b => b.toString(16).padStart(2, "0")).join("");
}

  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw "Enter a valid email address";
  if (String(pass || "").length < 6) throw "Password needs at least 6 characters";
  for (const id in d.users) if (d.users[id].email === email) throw "That email is already registered";
  const salt = uid() + uid();
  const hash = await sha(salt + ":" + pass);
  const id = "u_" + uid();
  const t = tgUser();
  d.users[id] = {
    id: id, email: email, name: String(name || "").trim() || email.split("@")[0], salt: salt, hash: hash,
    balance: 0, holdings: {}, created: now(),
    tgId: t ? String(t.id) : "", tgName: t ? ((t.first_name || "") + " " + (t.last_name || "")).trim() : ""
  };
  d.session = id;
  save();
  return d.users[id];
}
async function login(email, pass) {
  const d = db();
  email = String(email || "").trim().toLowerCase();
  for (const id in d.users) {
    const u = d.users[id];
    if (u.email !== email) continue;
    const hash = await sha(u.salt + ":" + pass);
    if (hash !== u.hash) throw "Wrong password";
    d.session = id;
    const t = tgUser();
    if (t) { u.tgId = String(t.id); u.tgName = ((t.first_name || "") + " " + (t.last_name || "")).trim(); }
    save();
    return u;
  }
  throw "No account with that email";
}
function logout() { db().session = null; save(); route = "home"; render(); toast("Signed out"); }

/* ---------- prices ---------- */
async function loadPrices(force) {
  const d = db();
  const c = d.coinsCache;
  if (!force && c && now() - c.ts < 5 * 60 * 1000) return;
  try {
    const r = await fetch("https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=250&page=1");
    if (!r.ok) throw "feed " + r.status;
    const j = await r.json();
    if (!Array.isArray(j) || !j.length) throw "empty";
    d.coinsCache = {
      ts: now(),
      list: j.map(x => ({ id: x.id, sym: String(x.symbol || "").toUpperCase(), name: x.name, price: x.current_price || 0, img: x.image || "" }))
    };
    save();
  } catch (e) {
    if (!d.coinsCache) {
      d.coinsCache = { ts: now(), list: FALLBACK_COINS.map(c => ({ id: c[0].toLowerCase(), sym: c[0], name: c[1], price: null, img: "" })) };
      save();
    }
  }
}
function coins() {
  const d = db();
  const live = (d.coinsCache && d.coinsCache.list) ? d.coinsCache.list : [];
  const seen = {};
  const out = [];
  live.forEach(c => { seen[c.sym] = 1; out.push(c); });
  (d.customCoins || []).forEach(c => { if (!seen[c.sym]) { out.push(c); seen[c.sym] = 1; } });
  if (!out.length) FALLBACK_COINS.forEach(c => out.push({ id: c[0].toLowerCase(), sym: c[0], name: c[1], price: null, img: "" }));
  return out;
}
function coinBy(sym) { const l = coins().filter(c => c.sym === sym); return l.length ? l[0] : null; }

/* ---------- desk pricing: admin sets a spread or a fixed price per coin ---------- */
const SPREAD_MAX = 25;
function rateOf(sym) {
  const c = coinBy(sym) || { sym: sym, name: sym, price: null };
  const r = (db().rates || {})[sym] || { mode: "market", spread: 0, price: null };
  const market = c.price;
  let unit = null;
  let label = "market price";
  if (r.mode === "fixed" && Number(r.price) > 0) {
    unit = Number(r.price);
    label = "desk price " + money(unit) + " (fixed)";
  } else if (r.mode === "spread" && market) {
    const s = Math.max(-SPREAD_MAX, Math.min(SPREAD_MAX, Number(r.spread) || 0));
    unit = market * (1 + s / 100);
    label = (s >= 0 ? "market +" + s + "%" : "market " + s + "%");
  } else if (market) {
    unit = market;
    label = "market price";
  }
  return { sym: sym, name: c.name, market: market, unit: unit, spread: Number(r.spread) || 0, mode: r.mode, fixed: r.price, label: label, img: c.img };
}
function setRate(sym, mode, spread, price) {
  const d = db();
  d.rates = d.rates || {};
  d.rates[sym] = { mode: mode, spread: Number(spread) || 0, price: price ? Number(price) : null, ts: now() };
  save();
}
function tiers() {
  const t = (db().tiers || []).filter(x => Number(x) > 0).map(x => Number(x));
  return t.length ? t : [20, 50, 100, 200, 500, 1000];
}
function setTiers(list) {
  db().tiers = list.filter(x => Number(x) > 0).map(x => Number(x));
  save();
}
function tierLabel(v) {
  if (v >= 1000000) return (v / 1000000) + "M";
  if (v >= 1000) return (v / 1000) + "K";
  return String(v);
}

/* ---------- relay to the bot ---------- */
function relayCfg() {
  const s = db().settings;
  return { url: CONFIG.relayUrl || s.relayUrl || "", key: CONFIG.adminKey || s.adminKey || "" };
}
async function relay(payload) {
  const c = relayCfg();
  if (!c.url || !c.key) return { ok: false, error: "relay not configured" };
  try {
    const body = Object.assign({ key: c.key }, payload);
    const r = await fetch(c.url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const j = await r.json();
    return (j && typeof j === "object") ? j : { ok: true };
  } catch (e) { return { ok: false, error: String(e) }; }
}

      const x = d.orders.filter(y => y.id === orderId)[0];
      x.status = "settled"; x.tx = tx; x.settledAt = now();
      const u = d.users[x.userId];
      if (u) { u.holdings = u.holdings || {}; u.holdings[x.coin] = +((u.holdings[x.coin] || 0) + Number(x.amount)).toFixed(8); save(); }
      save(); closeSheet(); toast("Settled and credited", "ok"); haptic("ok"); render();
    };
  });
}

      '<input id="rSpread" inputmode="decimal" value="' + esc(r.spread) + '" placeholder="1.5">' +
      '<div class="tiny" style="margin-top:6px">Negative means you sell below market. Only do that if you know why.</div></div>' +

      '<label>Fixed price in USD per 1 ' + esc(sym) + '</label>' +

    '<div style="height:14px"></div><button class="btn" id="rGo">Save price</button>' +
    '<div class="tiny" style="margin-top:10px">This is the price the buy screen quotes. It never changes what a coin is worth elsewhere - it only changes what you charge.</div>', () => {
    let mode = r.mode;
    const sw = $("#rSpread"), fw = $("#rFixed");
    const preview = () => {
      const s = Math.max(-SPREAD_MAX, Math.min(SPREAD_MAX, parseFloat(sw.value) || 0));
      let unit = r.market;
      if (mode === "spread") unit = r.market ? r.market * (1 + s / 100) : null;
      if (mode === "fixed") unit = parseFloat(fw.value) || null;
      $("#rPreview").textContent = prc(unit);
    };
    const pick = m => {
      mode = m;
      $("#mMarket").className = m === "market" ? "on" : "";
      $("#mSpread").className = m === "spread" ? "on" : "";
      $("#mFixed").className = m === "fixed" ? "on" : "";
      $("#rSpreadWrap").style.display = m === "spread" ? "block" : "none";
      $("#rFixedWrap").style.display = m === "fixed" ? "block" : "none";
      preview();
    };
    $("#mMarket").onclick = () => pick("market");
    $("#mSpread").onclick = () => pick("spread");
    $("#mFixed").onclick = () => pick("fixed");
    sw.oninput = preview; fw.oninput = preview;
    $("#rGo").onclick = () => {
      if (mode === "spread") {
        const s = parseFloat(sw.value) || 0;
        if (s < -SPREAD_MAX || s > SPREAD_MAX) { toast("Spread must be between -" + SPREAD_MAX + "% and +" + SPREAD_MAX + "%", "bad"); return; }
      }
      if (mode === "fixed" && (!(parseFloat(fw.value) > 0))) { toast("Enter a fixed price above zero", "bad"); return; }
      setRate(sym, mode, sw.value, fw.value);
      closeSheet(); toast("Price saved for " + sym, "ok"); haptic("ok"); render();
    };
  });
}

let walletQ = "";
function myWallets() {
  const u = me();
  if (!u) return [];
  return db().wallets.filter(w => w.userId === u.id).sort((a, b) => b.ts - a.ts);
}
function walletRecord(name) {
  const l = myWallets().filter(w => w.name === name);
  return l.length ? l[0] : null;
}
function walletInfo(name) {
  const l = WALLETS.filter(w => w[0] === name);
  if (!l.length) return { name: name, chain: "Multi", kind: "self" };
  return { name: l[0][0], chain: l[0][1], kind: l[0][2] };
}
function initials(n) {
  const p = String(n).replace(/[^A-Za-z0-9 ]/g, " ").split(" ").filter(x => x.length);
  const a = p.length ? p[0].slice(0, 1) : "W";
  const b = p.length > 1 ? p[1].slice(0, 1) : (p.length ? p[0].slice(1, 2) : "");
  return (a + b).toUpperCase();
}
function shortAddr(a) {
  a = String(a || "");
  return a.length > 16 ? a.slice(0, 8) + "\u2026" + a.slice(-6) : a;
}
function validAddress(chain, a) {
  a = String(a || "").trim();
  if (!a) return false;
  if (chain.indexOf("/") > -1) {
    const pats = [/^0x[a-fA-F0-9]{40}$/, /^[1-9A-HJ-NP-Za-km-z]{32,44}$/, /^T[1-9A-HJ-NP-Za-km-z]{33}$/,
      /^(EQ|UQ)[A-Za-z0-9_-]{46}$/, /^G[A-Z0-9]{51}$/, /^r[1-9A-HJ-NP-Za-km-z]{24,34}$/,
      /^(bc1[a-z0-9]{25,58}|[13][a-km-zA-HJ-NP-Z1-9]{25,50})$/];
    for (let i = 0; i < pats.length; i++) if (pats[i].test(a)) return true;
    return a.length >= 24 && a.length <= 100;
  }
  if (chain.indexOf("EVM") > -1) return /^0x[a-fA-F0-9]{40}$/.test(a);
  if (chain.indexOf("SOL") > -1) return /^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(a);
  if (chain.indexOf("TRX") > -1) return /^T[1-9A-HJ-NP-Za-km-z]{33}$/.test(a);
  if (chain.indexOf("TON") > -1) return /^(EQ|UQ)[A-Za-z0-9_-]{46}$/.test(a);
  if (chain.indexOf("XLM") > -1) return /^G[A-Z0-9]{51}$/.test(a);
  if (chain.indexOf("XRP") > -1) return /^r[1-9A-HJ-NP-Za-km-z]{24,34}$/.test(a);
  if (chain.indexOf("BTC") > -1) return /^(bc1[a-z0-9]{25,58}|[13][a-km-zA-HJ-NP-Z1-9]{25,50})$/.test(a);
  if (chain.indexOf("ADA") > -1) return /^addr1[a-z0-9]{55,110}$/.test(a) || /^[A-Za-z0-9]{40,70}$/.test(a);
  if (chain.indexOf("APT") > -1 || chain.indexOf("SUI") > -1) return /^0x[a-fA-F0-9]{64}$/.test(a);
  if (chain.indexOf("FLOW") > -1) return /^0x[a-fA-F0-9]{16}$/.test(a);
  if (chain.indexOf("COSMOS") > -1) return /^[a-z]{2,20}1[a-z0-9]{38,58}$/.test(a);
  return a.length >= 20 && a.length <= 120;
}
function ethProvider() {
  const e = window.ethereum;
  if (!e) return null;
  if (e.providers && e.providers.length) return e.providers[0];
  return e;
}
async function connectEVM() {
  const p = ethProvider();
  if (!p) throw "No wallet injected in this browser. Open it in your wallet app browser, or link an address below.";
  const acc = await p.request({ method: "eth_requestAccounts" });
  const address = acc && acc[0] ? String(acc[0]) : "";
  if (!address) throw "The wallet returned no address.";
  const nonce = "FC-" + Date.now().toString(36).toUpperCase() + "-" + code();
  const sig = await p.request({ method: "personal_sign", params: ["Flash Coin ownership check\nNonce: " + nonce, address] });
  if (!sig) throw "No signature returned.";
  return { address: address, nonce: nonce };
}

function bindWithdraw() {
  $("#wGo").onclick = () => {
    const u = me();
    const amt = parseFloat($("#wAmt").value) || 0;
    const addr = $("#wAddr").value.trim();
    const net = $("#wNet").value;
    if (amt <= 0) { toast("Enter an amount", "bad"); return; }
    if (amt > u.balance) { toast("Balance too low", "bad"); return; }
    if (addr.length < 8) { toast("Enter a valid address", "bad"); return; }
    u.balance = +(u.balance - amt).toFixed(8);
    const w = { id: "WD-" + code(), userId: u.id, userName: u.name, network: net, address: addr, amount: amt, status: "pending", ts: now() };

    doneSheet("Withdrawal requested", money(amt), "Held from your balance until the operator sends it", "WD " + w.id);
    setTimeout(() => { route = "withdraw"; render(); }, 1500);
  };
}

    '<label>Bot relay URL</label><input id="stUrl" value="' + esc(d.settings.relayUrl || CONFIG.relayUrl) + '" placeholder="Paste from /admin in the bot">' +
    '<label>Admin relay key</label><input id="stKey" value="' + esc(d.settings.adminKey || CONFIG.adminKey) + '" placeholder="32-character key from /admin">' +
    '<div style="height:14px"></div><button class="btn" id="stSave">Save relay</button>' +
    '<div style="height:8px"></div><button class="btn ghost" id="stTest">Test relay</button>' +
    '<div style="height:16px"></div><button class="btn ghost" id="stPass">Change admin password</button>' +
    '<div style="height:8px"></div><button class="btn ghost" id="stExport">Export data (JSON)</button>' +
    '<div style="height:8px"></div><button class="btn danger" id="stLock">Lock admin</button></div>';
}
function bindAdmin() {
  const un = $("#unlock");
  if (un) un.onclick = () => askAdminPass();
  $$("[data-at]").forEach(b => { b.onclick = () => { adminTab = b.dataset.at; render(); }; });

  $$("[data-ok]").forEach(b => {
    b.onclick = () => {
      const d = db();
      const x = d.deposits.filter(y => y.id === b.dataset.ok)[0];
      if (!x) return;
      x.status = "approved"; x.confirmedAt = now();
      const u = d.users[x.userId];
      if (u) u.balance = +(u.balance + Number(x.amount)).toFixed(8);
      save(); toast("Deposit credited", "ok"); haptic("ok"); render();
    };
  });
  $$("[data-no]").forEach(b => {
    b.onclick = () => {
      const x = db().deposits.filter(y => y.id === b.dataset.no)[0];
      if (!x) return;
      x.status = "rejected"; save(); toast("Deposit rejected"); render();
    };
  });
  $$("[data-pay]").forEach(b => {
    b.onclick = () => {
      const x = db().withdrawals.filter(y => y.id === b.dataset.pay)[0];
      if (!x) return;
      x.status = "paid"; save(); toast("Marked paid", "ok"); render();
    };
  });
  $$("[data-wrej]").forEach(b => {
    b.onclick = () => {
      const d = db();
      const x = d.withdrawals.filter(y => y.id === b.dataset.wrej)[0];
      if (!x) return;
      x.status = "rejected";
      const u = d.users[x.userId];
      if (u) u.balance = +(u.balance + Number(x.amount)).toFixed(8);
      save(); toast("Rejected and refunded"); render();
    };
  });
  $$("[data-settle]").forEach(b => {
    b.onclick = () => { settleSheet(b.dataset.settle); };
  });
  $$("[data-rate]").forEach(b => {
    b.onclick = () => { haptic(); rateSheet(b.dataset.rate); };
  });
  const tG = $("#tierGo");
  if (tG) tG.onclick = () => {
    const list = $("#tierIn").value.split(",").map(x => Number(String(x).trim())).filter(x => x > 0);
    if (!list.length) { toast("Enter at least one amount", "bad"); return; }
    if (list.length > 12) { toast("Keep it to 12 tiers or fewer", "bad"); return; }
    setTiers(list);
    toast("Tiers saved", "ok"); render();
  };
  $$("[data-cancel]").forEach(b => {
    b.onclick = () => {
      const d = db();
      const x = d.orders.filter(y => y.id === b.dataset.cancel)[0];
      if (!x) return;
      x.status = "cancelled";
      const u = d.users[x.userId];
      if (u) u.balance = +(u.balance + Number(x.total)).toFixed(8);
      save(); toast("Cancelled and refunded"); render();
    };
  });
  $$("[data-wok]").forEach(b => {
    b.onclick = () => {
      const x = db().wallets.filter(y => y.id === b.dataset.wok)[0];
      if (!x) return;
      x.status = "approved"; x.confirmedAt = now();
      save(); toast("Wallet approved", "ok"); haptic("ok"); render();
    };
  });
  $$("[data-wno]").forEach(b => {
    b.onclick = () => {
      const x = db().wallets.filter(y => y.id === b.dataset.wno)[0];
      if (!x) return;
      x.status = "rejected";
      save(); toast("Wallet rejected"); render();
    };
  });
  $$("[data-wmsg]").forEach(b => {
    b.onclick = () => { msgUserSheet(b.dataset.wmsg, "Wallet link"); };
  });
  $$("[data-credit]").forEach(b => {
    b.onclick = () => {
      const d = db();
      const u = d.users[b.dataset.credit];
      if (!u) return;
      sheet('<h2>Edit ' + esc(u.name) + '</h2><div class="k"><span>Balance now</span><span>' + money(u.balance) + '</span></div>' +
        '<label>Amount to add (use -50 to remove)</label><input id="crAmt" inputmode="decimal" placeholder="100">' +
        '<div style="height:14px"></div><button class="btn" id="crGo">Apply</button>' +
        '<div style="height:8px"></div><button class="btn ghost" id="crMsg">Message this user</button>', () => {
        $("#crGo").onclick = () => {
          const v = parseFloat($("#crAmt").value) || 0;
          u.balance = +Math.max(0, u.balance + v).toFixed(8);
          save(); closeSheet(); toast("Balance updated", "ok"); render();
        };
        $("#crMsg").onclick = () => {
          closeSheet(); adminTab = "broadcast"; render();
          setTimeout(() => { const el = $("#dmTo"); if (el) el.value = u.tgId || ""; }, 80);
        };
      });
    };
  });
  $$("[data-mtoggle]").forEach(b => {
    b.onclick = () => {
      const m = db().methods.filter(x => x.id === b.dataset.mtoggle)[0];
      if (m) { m.on = (m.on === false); save(); render(); }
    };
  });
  $$("[data-mdel]").forEach(b => {
    b.onclick = () => {
      db().methods = db().methods.filter(x => x.id !== b.dataset.mdel);
      save(); toast("Method removed"); render();
    };
  });
  const mAdd = $("#mAdd");
  if (mAdd) mAdd.onclick = () => {
    const wallet = $("#mWallet").value.trim();
    const coin = $("#mCoin").value.trim().toUpperCase();
    const address = $("#mAddr").value.trim();
    if (!wallet) { toast("Name the wallet", "bad"); return; }
    if (!coin) { toast("Which coin?", "bad"); return; }
    if (address.length < 8) { toast("Enter the receiving address", "bad"); return; }
    db().methods.push({ id: "m_" + uid(), wallet: wallet, coin: coin, network: $("#mNet").value, address: address, note: $("#mNote").value.trim(), on: true, ts: now() });
    save(); toast("Method added", "ok"); render();
  };
  const cAdd = $("#cAdd");
  if (cAdd) cAdd.onclick = () => {
    const sym = $("#cSym").value.trim().toUpperCase();
    const name = $("#cName").value.trim() || sym;
    const p = $("#cPrice").value.trim();
    if (!sym) { toast("Symbol required", "bad"); return; }
    db().customCoins = db().customCoins || [];
    if (db().customCoins.filter(c => c.sym === sym).length || coinBy(sym)) { toast("Already listed", "bad"); return; }
    db().customCoins.push({ id: sym.toLowerCase(), sym: sym, name: name, price: p ? (parseFloat(p) || 0) : null, img: "" });
    save(); toast("Coin added", "ok"); render();
  };
  $$("[data-cdel]").forEach(b => {
    b.onclick = () => {
      db().customCoins = (db().customCoins || []).filter(c => c.sym !== b.dataset.cdel);
      save(); render();
    };
  });
  $$("[data-reply]").forEach(b => {
    b.onclick = () => {
      const id = b.dataset.reply;
      const u = db().users[id] || { name: id };
      const t = db().tickets[id] || [];
      const msgs = t.map(m => '<div class="msg ' + (m.from === "user" ? "u" : "a") + '">' + esc(m.text) + '<span class="when">' + ago(m.ts) + '</span></div>').join("");
      sheet('<h2>' + esc(u.name) + '</h2><div class="chat" style="max-height:40vh">' + msgs + '</div>' +
        '<label>Reply</label><textarea id="rpText" placeholder="Type your reply..."></textarea>' +
        '<div style="height:12px"></div><button class="btn" id="rpGo">Send reply</button>', () => {
        $("#rpGo").onclick = async () => {
          const v = $("#rpText").value.trim();
          if (!v) { toast("Write a reply", "bad"); return; }
          const d = db();
          d.tickets[id] = d.tickets[id] || [];
          d.tickets[id].push({ from: "admin", text: v, ts: now() });
          save();
          const r = await relay({ action: "send", to: u.tgId || "", text: "\uD83D\uDCAC Support from " + CONFIG.brand + "\n\n" + v });
          if (r.ok) { toast("Delivered on Telegram", "ok"); } else { toast("Saved here. Relay needed: " + (r.error || ""), "bad"); }
          closeSheet(); render();
        };
      });
    };
  });
  const bc = $("#bcGo");
  if (bc) bc.onclick = async () => {
    const v = $("#bcText").value.trim();
    if (!v) { toast("Write the announcement", "bad"); return; }
    bc.disabled = true; bc.textContent = "Sending...";
    const r = await relay({ action: "broadcast", text: v });
    bc.disabled = false; bc.textContent = "Send to everyone";
    if (r.ok) { toast("Broadcast queued by the bot", "ok"); haptic("ok"); $("#bcText").value = ""; }
    else { toast("Not sent: " + (r.error || "relay not connected"), "bad"); }
  };
  const dm = $("#dmGo");
  if (dm) dm.onclick = async () => {
    let to = $("#dmTo").value.trim();
    const v = $("#dmText").value.trim();
    if (!v) { toast("Write the message", "bad"); return; }
    const d = db();
    if (to.indexOf("@") > -1 || /[a-z]/i.test(to)) {
      const found = Object.keys(d.users).map(k => d.users[k]).filter(u => u.email === to.toLowerCase())[0];
      to = found ? found.tgId : "";
    }
    if (!to) { toast("No Telegram id for that user", "bad"); return; }
    const r = await relay({ action: "send", to: to, text: v });
    if (r.ok) { toast("Message delivered", "ok"); $("#dmText").value = ""; }
    else { toast("Not sent: " + (r.error || "relay not connected"), "bad"); }
  };
  const st = $("#stSave");
  if (st) st.onclick = () => {
    db().settings.relayUrl = $("#stUrl").value.trim();
    db().settings.adminKey = $("#stKey").value.trim();
    save(); toast("Relay saved", "ok");
  };
  const sT = $("#stTest");
  if (sT) sT.onclick = async () => {
    const r = await relay({ action: "ping" });
    toast(r.ok ? "Relay answered" : "No answer: " + (r.error || "check the URL and key"), r.ok ? "ok" : "bad");
  };
  const sP = $("#stPass");
  if (sP) sP.onclick = () => setAdminPass();
  const sE = $("#stExport");
  if (sE) sE.onclick = () => {
    const blob = new Blob([JSON.stringify(db(), null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "flashcoin-backup-" + new Date().toISOString().slice(0, 10) + ".json";
    a.click(); URL.revokeObjectURL(a.href);
  };
  const sL = $("#stLock");
  if (sL) sL.onclick = () => adminOff();
}

/* ---------- sheets ---------- */
function sheet(html, bind) {
  $("#modalRoot").innerHTML = '<div class="sheet" id="sh"><div class="box"><div class="grab"></div>' + html + '</div></div>';
  if (bind) bind();
  $("#sh").onclick = ev => { if (ev.target.id === "sh") closeSheet(); };
}
function closeSheet() { $("#modalRoot").innerHTML = ""; }
function doneSheet(title, big, cap, ref) {
  $("#modalRoot").innerHTML = '<div class="sheet"><div class="box"><div class="done">' +
    '<svg viewBox="0 0 60 60"><circle class="ring" cx="30" cy="30" r="26"/><path class="tick" d="M18 31l8 8 16-17"/></svg>' +
    '<div style="font-weight:750;font-size:15px">' + esc(title) + '</div>' +
    '<div class="big">' + esc(big) + '</div>' +
    '<div class="cap">' + esc(cap) + '</div>' +
    (ref ? '<div class="tiny" style="margin-top:8px">' + esc(ref) + '</div>' : '') +
    '<div style="height:16px"></div><button class="btn ghost" id="doneClose">Done</button>' +
    '</div></div></div>';
  $("#doneClose").onclick = () => { closeSheet(); render(); };
}

/* ---------- boot ---------- */
(async function boot() {
  tgInit();
  Store.get();
  await loadPrices(false);
  render();
  loadPrices(true).then(() => { if (route === "market" || route === "home") render(); });
})();
</script>
